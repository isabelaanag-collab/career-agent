# Critérios de busca do Career Agent AI
# Editável a qualquer momento — runner.py lê este arquivo a cada execução (GitHub Actions, 3x/dia: 7h, 12h, 18h BRT).

salario_minimo_brl: 6000
# Se a vaga não informa salário, usar a estimativa (Indeed/Glassdoor-like) quando disponível.
# Vagas sem nenhuma informação de salário (nem estimativa) não devem ser descartadas só por isso,
# mas devem ficar marcadas como "salario: não informado" no relatório.

localidades:
  cidades_presencial_ou_hibrido:
    - Belo Horizonte
    - Betim
    - Contagem
    - Nova Lima
  aceita_remoto: true
  aceita_hibrido: true
  # presencial só é aceito se a cidade da vaga estiver na lista acima

areas:
  - Supply Chain
  - S&OE
  - S&OP
  - Planejamento
  - MRP
  - PCP
  - Planejamento de Demanda
  - Demand Planning
  - Analista de Demanda
  - Especialista de Demanda
  - Supply Planning
  - Compras
  - Suprimentos
  - Logística

filtro_cargo:
  # Filtro rígido de senioridade — aplicado em src/filters.py, sem LLM.
  # Vaga cujo título contenha qualquer um destes termos é descartada automaticamente,
  # não importa a área/salário (case-insensitive, sem acento).
  excluded_keywords:
    - Estágio
    - Estagiário
    - Estagiária
    - Trainee
    - Assistente
    - Auxiliar
    - Operador
    - Conferente
    - Jovem Aprendiz
    - Prático
    - Técnico
    - Ajudante
    - Motorista
    - Estoquista
  # Termos que indicam nível aceitável. Usados em dois pontos do filtro duro:
  # (1) vaga sem salário informado só passa se o título contiver um destes termos
  #     (ver src/filters.py::matches_salary); (2) referência do que se espera aceitar
  # — Analista, Especialista, Coordenador, Supervisor e Gerente, nos níveis Pleno/Sênior/Lead.
  allowed_seniorities:
    - Analista
    - Pleno
    - Sênior
    - Lead
    - Especialista
    - Coordenador
    - Supervisor
    - Gerente

priorizar_multinacionais: true

empresas_favoritas:
  - Stellantis
  - Henkel
  - Anglo American
  - ESAB
  - Brembo
  - Localiza&Co
  - Bosch
  - CNH Industrial
  - ArcelorMittal
  - Vale
  - Ambev
  - Mercado Livre
  - Amazon
  - VLI
  - RHI Magnesita
  - Farmax
  - Eurofarma
  - Nestlé
  - Unilever
  - Schneider Electric
  - Siemens
  - ABB
  - MRV&Co

plataformas:
  # A busca diária (runner.py, via GitHub Actions) usa scrapers Python puros —
  # nenhuma dessas plataformas é acessada por login nem por candidatura automática.
  # Ver src/scrapers/ para a implementação de cada uma.
  gupy:
    modo: scraper_publico   # API pública não-autenticada do portal.gupy.io
  indeed:
    modo: scraper_publico   # HTML público de resultado de busca (sem API paga)
  vagas.com:
    modo: scraper_publico   # HTML público de resultado de busca
  linkedin:
    modo: scraper_publico_instavel  # endpoint público "guest", sem login — mas o LinkedIn
                                     # aplica rate-limit agressivo; pode retornar 0 resultados
                                     # em várias execuções. Ver src/scrapers/linkedin.py.
  solides:
    modo: nao_implementado  # SPA sem endpoint público identificado — ver src/scrapers/solides.py

match_score:
  limiar_prepara_candidatura: 70   # score >= 70 -> status "Aguardando aprovação"
  limiar_excelente: 80             # score >= 80 -> destaque "Excelente Match" no dashboard
  # Independentemente do score, toda candidatura para antes do envio para aprovação de 1 clique.

candidatura_automatica:
  permitido_em: [indeed]           # únicas plataformas com candidatura assistida (via navegador local)
  requer_aprovacao_antes_de_enviar: true
  nunca_inventar_informacoes: true
  nunca_alterar_datas: true
  nunca_criar_experiencias_inexistentes: true

google_sheets:
  # Preencha com o ID da planilha (a string longa na URL entre /d/ e /edit).
  # Alternativa: defina o secret/variável de ambiente GOOGLE_SHEET_ID em vez de editar aqui.
  spreadsheet_id: "1cL6xJDKZKAZOgNEPteRAAybgsPWf93W4gaGuMIYADqs"
  worksheet_name: ""   # em branco = primeira aba da planilha
